name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon 或 Intel runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PySide6 python-rtmidi pyinstaller

      - name: Build App
        run: |
          pyinstaller \
            --windowed \
            --name "LouDuck MTC Sync" \
            --icon "assets/icon.icns" \
            --hidden-import=rtmidi \
            mtc_sync_app.py

      - name: Sign App
        run: codesign --force --deep --sign - "dist/LouDuck MTC Sync.app"

      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "LouDuck MTC Sync" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "LouDuck-MTC-Sync.dmg" \
            "dist/LouDuck MTC Sync.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LouDuck-MTC-Sync-macOS
          path: LouDuck-MTC-Sync.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LouDuck-MTC-Sync.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
